name: paisapath
description: A financial management app with micro-investment features.
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1          # For API calls (OpenRouter, Alpha Vantage)
  provider: ^6.1.2      # State management
  flutter_local_notifications: ^17.0.0  # For notifications
  intl: ^0.19.0         # Date formatting
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true